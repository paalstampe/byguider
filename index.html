<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pål og Vibekes byguider</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Byguider">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F7F4EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="forside">

<main class="forside-innhold">
  <header class="sidebar-head forside-head">
    <nav class="smuler" data-t-aria="duErHer">
      <a href="/">stam.pe</a><span class="smule-skille">/</span><span aria-current="page" data-t="byguider">Byguider</span>
      <span class="sprakvalg" role="group" data-t-aria="sprak"><button type="button" data-sprak="no" lang="no">NO</button><span class="smule-skille">/</span><button type="button" data-sprak="en" lang="en">EN</button></span>
    </nav>
    <h1 class="tittel" data-t="tittel">Pål og Vibekes byer</h1>
    <p class="ingress" data-t="ingress">Byene slik vi bruker dem.</p>
  </header>
  <nav class="by-liste" id="by-liste" data-t-aria="byer"></nav>
  <section class="offline-boks" id="offline-boks" hidden>
    <button type="button" class="chip" id="lagre-alle" data-t="lagreAlle"></button>
    <p class="offline-merknad" id="offline-merknad" aria-live="polite"></p>
  </section>
</main>

<script>
/* Offline: sw.js lagrer alle byenes sider og data; kartet lagres når en by åpnes. */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
<script>
/* Språk: samme valg og lagring som i app.js (NO / EN, ?lang=en, husket i nettleseren).
   Lista bygges fra byer.json — ny by vises her automatisk. Engelske tekster fra
   feltene land_en, beskrivelse_en og evt. navn_en; mangler de, vises norsk.
   Miniatyr: bilder/<id>.webp (360×270, lages med .claude/miniatyrer.sh), eller feltet «bilde»
   i byer.json. By med status «kommer» eller uten bilde får en tom ramme i samme størrelse. */
const NOKKEL = 'byguider-sprak';
const TEKST = {
  no: { duErHer: 'Du er her', sidetittel: 'Pål og Vibekes byguider', byguider: 'Byguider', tittel: 'Pål og Vibekes byer',
        ingress: 'Byene slik vi bruker dem.', byer: 'Byer', sprak: 'Språk',
        lagreAlle: 'Lagre alle byene for bruk uten nett',
        lagreMerknad: 'Henter kartene for alle byene, ca. 100 MB i alt. Bruk wifi.',
        lagrer: (by, pst, n, tot) => 'Lagrer ' + by + ' … ' + pst + ' % (' + n + ' av ' + tot + ')',
        ferdig: 'Alle byene er klare uten nett.',
        delvis: 'Noe ble ikke lagret. Prøv igjen.',
        kreverNett: 'Krever nett.',
        klar: dato => 'Klar uten nett · ' + dato },
  en: { duErHer: 'You are here', sidetittel: 'Pål and Vibeke’s city guides', byguider: 'City guides', tittel: 'Pål and Vibeke’s cities',
        ingress: 'The cities as we use them.', byer: 'Cities', sprak: 'Language',
        lagreAlle: 'Save all cities for offline use',
        lagreMerknad: 'Downloads the maps for all cities, about 100 MB in total. Use Wi-Fi.',
        lagrer: (by, pst, n, tot) => 'Saving ' + by + ' … ' + pst + '% (' + n + ' of ' + tot + ')',
        ferdig: 'All cities are available offline.',
        delvis: 'Something was not saved. Try again.',
        kreverNett: 'Requires a connection.',
        klar: dato => 'Available offline · ' + dato }
};

let sprak = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'en' || q === 'no') {
    try { localStorage.setItem(NOKKEL, q); } catch (e) {}
    return q;
  }
  try {
    const l = localStorage.getItem(NOKKEL);
    if (l === 'en' || l === 'no') return l;
  } catch (e) {}
  return 'no';
})();

let byer = [];

function tegn() {
  const T = TEKST[sprak];
  const en = sprak === 'en';
  document.documentElement.lang = sprak;
  document.title = T.sidetittel;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T[e.dataset.t]; });
  document.querySelectorAll('[data-t-aria]').forEach(e => { e.setAttribute('aria-label', T[e.dataset.tAria]); });
  document.querySelectorAll('.sprakvalg [data-sprak]').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.sprak === sprak ? 'true' : 'false');
  });

  if (!lagrer && !merknadSatt) document.getElementById('offline-merknad').textContent = T.lagreMerknad;

  const nav = document.getElementById('by-liste');
  nav.innerHTML = '';
  byer.forEach(b => {
    // status: "kommer" = vises dempet og uten lenke
    const klar = b.status !== 'kommer';
    const a = document.createElement(klar ? 'a' : 'div');
    a.className = 'by-lenke' + (klar ? '' : ' er-inaktiv');
    if (klar) a.href = b.id + '/' + (en ? '?lang=en' : '');
    else a.setAttribute('aria-disabled', 'true');
    let bilde;
    if (klar) {
      bilde = document.createElement('img');
      bilde.src = b.bilde || 'bilder/' + b.id + '.webp';
      bilde.alt = '';
      bilde.width = 120;
      bilde.height = 90;
      bilde.addEventListener('error', () => bilde.replaceWith(tomRamme()));
    } else bilde = tomRamme();
    bilde.classList.add('miniatyr');
    const tekst = document.createElement('span');
    tekst.className = 'by-tekst';
    const navn = document.createElement('span');
    navn.className = 'by-navn';
    navn.textContent = (en && b.navn_en) || b.navn;
    const meta = document.createElement('span');
    meta.className = 'by-meta';
    meta.textContent = [(en && b.land_en) || b.land, (en && b.beskrivelse_en) || b.beskrivelse]
      .filter(Boolean).join(' · ');
    tekst.append(navn, meta);
    const dato = klar && offlineDato(b.id);
    if (dato) {
      const st = document.createElement('span');
      st.className = 'by-offline';
      st.textContent = T.klar(dato);
      tekst.append(st);
    }
    a.append(bilde, tekst);
    nav.appendChild(a);
  });
}

/* Offline: datoen en by sist ble lagret, satt av app.js (samme nøkkel). */
function offlineDato(id) {
  let v = null;
  try { v = localStorage.getItem('byguider-offline:' + new URL('./', location.href).pathname + id); } catch (e) {}
  const d = v ? new Date(v) : null;
  if (!d || isNaN(d)) return null;
  return sprak === 'en' ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
    : d.getDate() + '.' + (d.getMonth() + 1) + '.';
}

/* «Lagre alle byene»: åpner hver by i en usynlig ramme, én om gangen. Byen lagrer seg selv
   (forhandslastOffline i app.js, i lagremodus) og melder fremdrift og resultat hit. */
let lagrer = false, merknadSatt = false;
async function lagreAlle() {
  if (lagrer) return;
  const T = () => TEKST[sprak];
  const merknad = document.getElementById('offline-merknad');
  const knapp = document.getElementById('lagre-alle');
  if (!navigator.onLine) { merknad.textContent = T().kreverNett; merknadSatt = true; return; }
  lagrer = true;
  knapp.disabled = true;
  const liste = byer.filter(b => b.status !== 'kommer');
  let feil = 0;
  for (let i = 0; i < liste.length; i++) {
    const b = liste[i];
    const navn = (sprak === 'en' && b.navn_en) || b.navn;
    const vis = pst => { merknad.textContent = T().lagrer(navn, pst, i + 1, liste.length); };
    vis(0);
    const resultat = await new Promise(ferdig => {
      const ramme = document.createElement('iframe');
      ramme.className = 'lagre-ramme';
      ramme.setAttribute('aria-hidden', 'true');
      ramme.tabIndex = -1;
      ramme.src = b.id + '/?lagre=1';
      const frist = setTimeout(() => slutt({ feilet: 1 }), 15 * 60 * 1000);
      function lytt(e) {
        if (e.source !== ramme.contentWindow || !e.data || e.data.by !== b.id) return;
        if (e.data.type === 'byguider-fremdrift') vis(e.data.pst);
        if (e.data.type === 'byguider-lagret') slutt(e.data);
      }
      function slutt(d) {
        clearTimeout(frist);
        window.removeEventListener('message', lytt);
        ramme.remove();
        ferdig(d);
      }
      window.addEventListener('message', lytt);
      document.body.appendChild(ramme);
    });
    if (resultat.feilet) feil++;
    tegn();
  }
  merknad.textContent = feil ? T().delvis : T().ferdig;
  merknadSatt = true;
  knapp.disabled = false;
  lagrer = false;
}
document.getElementById('lagre-alle').addEventListener('click', lagreAlle);
if ('serviceWorker' in navigator) document.getElementById('offline-boks').hidden = false;

function tomRamme() {
  const r = document.createElement('span');
  r.className = 'miniatyr er-tom';
  return r;
}

document.addEventListener('click', e => {
  const b = e.target.closest('.sprakvalg [data-sprak]');
  if (!b || b.dataset.sprak === sprak) return;
  sprak = b.dataset.sprak;
  try { localStorage.setItem(NOKKEL, sprak); } catch (err) {}
  const u = new URL(location.href);
  if (sprak === 'en') u.searchParams.set('lang', 'en'); else u.searchParams.delete('lang');
  history.replaceState(history.state, '', u);
  tegn();
});

tegn();
fetch('byer.json')
  .then(r => r.json())
  .then(m => { byer = m.byer || []; tegn(); });
</script>
</body>
</html>
