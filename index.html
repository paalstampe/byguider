<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Påls byguider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="forside">

<main class="forside-innhold">
  <header class="sidebar-head forside-head">
    <p class="kicker">Byguider</p>
    <h1 class="tittel">Påls byer</h1>
    <p class="ingress">Nabolag, gater og steder verdt en omvei.</p>
  </header>
  <nav class="by-liste" id="by-liste" aria-label="Byer"></nav>
</main>

<script>
/* Lista bygges fra byer.json — ny by vises her automatisk. */
fetch('byer.json')
  .then(r => r.json())
  .then(m => {
    const nav = document.getElementById('by-liste');
    (m.byer || []).forEach(b => {
      const a = document.createElement('a');
      a.className = 'by-lenke';
      a.href = b.id + '/';
      const navn = document.createElement('span');
      navn.className = 'by-navn';
      navn.textContent = b.navn;
      const meta = document.createElement('span');
      meta.className = 'by-meta';
      meta.textContent = [b.land, b.beskrivelse].filter(Boolean).join(' · ');
      a.append(navn, meta);
      nav.appendChild(a);
    });
  });
</script>
</body>
</html>
