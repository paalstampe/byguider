<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pål og Vibekes byguider</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Byguider">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F7F4EE">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="forside">

<main class="forside-innhold">
  <header class="sidebar-head forside-head">
    <nav class="smuler" data-t-aria="duErHer">
      <a href="/">stam.pe</a><span class="smule-skille">/</span><span aria-current="page" data-t="byguider">Byguider</span>
      <span class="sprakvalg" role="group" data-t-aria="sprak"><button type="button" data-sprak="no" lang="no">NO</button><span class="smule-skille">/</span><button type="button" data-sprak="en" lang="en">EN</button></span>
    </nav>
    <h1 class="tittel" data-t="tittel">Pål og Vibekes byer</h1>
    <p class="kicker" data-t="kicker">Høyst subjektive byguider</p>
    <p class="ingress" data-t="ingress">Høyst subjektive guider til nabolag, restauranter og annet verdt en omvei. Byene slik vi bruker dem.</p>
  </header>
  <nav class="by-liste" id="by-liste" data-t-aria="byer"></nav>
  <section class="offline-boks" id="offline-boks" hidden>
    <button type="button" class="chip" id="lagre-alle" data-t="lagreAlle"></button>
    <p class="offline-merknad" id="offline-merknad" aria-live="polite"></p>
    <p class="offline-lager" id="offline-lager" hidden><span data-t="lagretHer"></span> · <button type="button" class="lenkeknapp" id="slett-lagret" data-t="slett">Slett</button></p>
  </section>
</main>

<script>
/* Offline: sw.js lagrer alle byenes sider og data; kartet lagres når en by åpnes. */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
<script>
/* Språk: samme valg og lagring som i app.js (NO / EN, ?lang=en, husket i nettleseren).
   Lista bygges fra byer.json — ny by vises her automatisk. Engelsk navn fra
   feltet navn_en hvis det finnes. Lista viser bare navnet, uten land eller beskrivelse.
   Miniatyr: bilder/<id>.webp (360×270, lages med .claude/miniatyrer.sh), eller feltet «bilde»
   i byer.json. I mørk modus bilder/<id>-mork.webp; mangler den, brukes den lyse. By med status «kommer» eller uten bilde får en tom ramme i samme størrelse.
   By med «skjult»: true vises ikke her og tas ikke med i «Lagre alle byene», men guiden virker på /<id>/. */
const NOKKEL = 'byguider-sprak';
const TEKST = {
  no: { duErHer: 'Du er her', sidetittel: 'Pål og Vibekes byguider', byguider: 'Byguider', tittel: 'Pål og Vibekes byer', kicker: 'Høyst subjektive byguider',
        ingress: 'Høyst subjektive guider til nabolag, restauranter og annet verdt en omvei. Byene slik vi bruker dem.', byer: 'Byer', sprak: 'Språk',
        lagreAlle: 'Lagre alle byene for bruk offline',
        lagreMerknad: 'Henter kartene for alle byene, ca. 100 MB i alt. Bruk wifi.',
        lagrer: (by, pst, n, tot) => 'Lagrer ' + by + ' … ' + pst + ' % (' + n + ' av ' + tot + ')',
        ferdig: 'Alle byene er tilgjengelige offline.',
        delvis: 'Noe ble ikke lagret. Prøv igjen.',
        kreverNett: 'Krever nett.',
        lagretHer: 'Byguidene er lagret på denne enheten',
        slett: 'Slett',
        slettSporsmal: 'Slette byguidene fra denne enheten? Kartene lastes ned igjen neste gang du åpner en by med nett.',
        klar: dato => 'Tilgjengelig offline · ' + dato },
  en: { duErHer: 'You are here', sidetittel: 'Pål and Vibeke’s city guides', byguider: 'City guides', tittel: 'Pål and Vibeke’s cities', kicker: 'Opinionated city guides',
        ingress: 'Opinionated guides to neighbourhoods, restaurants and more worth a detour. The cities as we use them.', byer: 'Cities', sprak: 'Language',
        lagreAlle: 'Save all cities for offline use',
        lagreMerknad: 'Downloads the maps for all cities, about 100 MB in total. Use Wi-Fi.',
        lagrer: (by, pst, n, tot) => 'Saving ' + by + ' … ' + pst + '% (' + n + ' of ' + tot + ')',
        ferdig: 'All cities are available offline.',
        delvis: 'Something was not saved. Try again.',
        kreverNett: 'Requires a connection.',
        lagretHer: 'The city guides are stored on this device',
        slett: 'Delete',
        slettSporsmal: 'Delete the city guides from this device? The maps will be downloaded again next time you open a city online.',
        klar: dato => 'Available offline · ' + dato }
};

let sprak = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'en' || q === 'no') {
    try { localStorage.setItem(NOKKEL, q); } catch (e) {}
    return q;
  }
  try {
    const l = localStorage.getItem(NOKKEL);
    if (l === 'en' || l === 'no') return l;
  } catch (e) {}
  return 'no';
})();

let byer = [];

function tegn() {
  const T = TEKST[sprak];
  const en = sprak === 'en';
  document.documentElement.lang = sprak;
  document.title = T.sidetittel;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T[e.dataset.t]; });
  document.querySelectorAll('[data-t-aria]').forEach(e => { e.setAttribute('aria-label', T[e.dataset.tAria]); });
  document.querySelectorAll('.sprakvalg [data-sprak]').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.sprak === sprak ? 'true' : 'false');
  });

  if (!lagrer && !merknadSatt) document.getElementById('offline-merknad').textContent = T.lagreMerknad;
  visLagring();

  const nav = document.getElementById('by-liste');
  nav.innerHTML = '';
  byer.forEach(b => {
    // status: "kommer" = vises dempet og uten lenke
    const klar = b.status !== 'kommer';
    const a = document.createElement(klar ? 'a' : 'div');
    a.className = 'by-lenke' + (klar ? '' : ' er-inaktiv');
    if (klar) a.href = b.id + '/' + (en ? '?lang=en' : '');
    else a.setAttribute('aria-disabled', 'true');
    let bilde;
    if (klar) {
      bilde = document.createElement('img');
      const lys = b.bilde || 'bilder/' + b.id + '.webp';
      const mork = !b.bilde && matchMedia('(prefers-color-scheme: dark)').matches && 'bilder/' + b.id + '-mork.webp';
      bilde.src = mork || lys;
      bilde.alt = '';
      bilde.width = 120;
      bilde.height = 90;
      bilde.addEventListener('error', () => {
        if (mork && !bilde.src.endsWith(lys)) bilde.src = lys;
        else bilde.replaceWith(tomRamme());
      });
    } else bilde = tomRamme();
    bilde.classList.add('miniatyr');
    const tekst = document.createElement('span');
    tekst.className = 'by-tekst';
    const navn = document.createElement('span');
    navn.className = 'by-navn';
    navn.textContent = (en && b.navn_en) || b.navn;
    tekst.append(navn);
    const dato = klar && offlineDato(b.id);
    if (dato) {
      const st = document.createElement('span');
      st.className = 'by-offline';
      st.textContent = T.klar(dato);
      tekst.append(st);
    }
    a.append(bilde, tekst);
    nav.appendChild(a);
  });
}

/* Offline: datoen en by sist ble lagret, satt av app.js og lagreAlle (samme nøkkel). */
const offlineNokkel = id => 'byguider-offline:' + new URL('./', location.href).pathname + id;
function offlineDato(id) {
  let v = null;
  try { v = localStorage.getItem(offlineNokkel(id)); } catch (e) {}
  const d = v ? new Date(v) : null;
  if (!d || isNaN(d)) return null;
  return d.getDate() + (sprak === 'en'
    ? ' ' + 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')[d.getMonth()]
    : '. ' + 'jan feb mar apr mai jun jul aug sep okt nov des'.split(' ')[d.getMonth()]);
}

/* «Lagre alle byene»: ber sw.js lagre alle byene (lagreByer i sw.js regner ut kartet selv, uten å tegne
   det) og viser fremdriften. Kartstil og MapLibre er de samme som KARTSTIL og RESSURSER i app.js. */
const KARTSTIL = 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json';
const MAPLIBRE = ['https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css', 'https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js'];
let lagrer = false, merknadSatt = false, igjen = [], feil = 0;

async function lagreAlle() {
  const merknad = document.getElementById('offline-merknad');
  if (lagrer) return;
  if (!navigator.onLine) { merknad.textContent = TEKST[sprak].kreverNett; merknadSatt = true; return; }
  const liste = byer.filter(b => b.status !== 'kommer');
  lagrer = true; feil = 0;
  igjen = liste.map(b => b.id);
  document.getElementById('lagre-alle').disabled = true;
  document.getElementById('slett-lagret').disabled = true;
  merknad.textContent = TEKST[sprak].lagrer(navnPa(liste[0].id), 0, 1, liste.length);
  const adresser = MAPLIBRE.concat(performance.getEntriesByType('resource').map(e => e.name).filter(u => /^https?:/.test(u)));
  const reg = await navigator.serviceWorker.ready;
  reg.active.postMessage({ type: 'lagre', stil: KARTSTIL, adresser: adresser, byer: liste.map(b => ({
    id: b.id,
    side: new URL(b.id + '/', location.href).href,
    data: new URL(b.data || 'data/' + b.id + '.md', location.href).href,
    geometri: b.geometri ? new URL(b.geometri, location.href).href : null
  })) });
}

/* Slett: bare byguidene. stam.pe, byguidene og reiseplanleggingen deler lager, men her slettes bare
   byguidenes lagre (byguider-*, se sw.js), service workeren for denne mappa og datoene for «Tilgjengelig
   offline». Plassbruk vises ikke: nettleseren oppgir bare tallet for hele stam.pe. Linja vises når
   kartene er lagret. «Slett alt» finnes på stam.pe-forsiden. */
async function visLagring() {
  const linje = document.getElementById('offline-lager');
  if (lagrer || !('caches' in window)) return;
  try { linje.hidden = !(await caches.keys()).some(n => n.startsWith('byguider-kart-')); } catch (e) { linje.hidden = true; }
}

async function slettLagret() {
  if (lagrer || !confirm(TEKST[sprak].slettSporsmal)) return;
  const her = new URL('./', location.href).href;
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.filter(r => r.scope === her).map(r => r.unregister()));
    await Promise.all((await caches.keys()).filter(n => n.startsWith('byguider-')).map(n => caches.delete(n)));
  } catch (e) {}
  try {
    Object.keys(localStorage).filter(k => k.startsWith('byguider-offline:')).forEach(k => localStorage.removeItem(k));
  } catch (e) {}
  location.reload();
}

const navnPa = id => { const b = byer.find(x => x.id === id) || {}; return (sprak === 'en' && b.navn_en) || b.navn || id; };

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', e => {
    const m = e.data || {};
    if (!lagrer || !igjen.includes(m.by)) return;
    const merknad = document.getElementById('offline-merknad');
    const alle = byer.filter(b => b.status !== 'kommer').length;
    const nr = alle - igjen.length + 1;
    if (m.type === 'fremdrift') {
      merknad.textContent = TEKST[sprak].lagrer(navnPa(m.by), Math.floor(100 * m.ferdig / Math.max(1, m.totalt)), nr, alle);
    } else if (m.type === 'lagret') {
      if (m.feilet) feil++;
      else try { localStorage.setItem(offlineNokkel(m.by), new Date().toISOString()); } catch (err) {}
      igjen = igjen.filter(id => id !== m.by);
      if (!igjen.length) {
        lagrer = false;
        merknadSatt = true;
        document.getElementById('lagre-alle').disabled = false;
        document.getElementById('slett-lagret').disabled = false;
      }
      tegn();
      merknad.textContent = igjen.length ? TEKST[sprak].lagrer(navnPa(igjen[0]), 0, nr + 1, alle)
        : feil ? TEKST[sprak].delvis : TEKST[sprak].ferdig;
    }
  });
  navigator.serviceWorker.startMessages();   // Safari leverer ellers ikke meldingene til addEventListener
  document.getElementById('lagre-alle').addEventListener('click', lagreAlle);
  document.getElementById('slett-lagret').addEventListener('click', slettLagret);
  document.getElementById('offline-boks').hidden = false;
}

function tomRamme() {
  const r = document.createElement('span');
  r.className = 'miniatyr er-tom';
  return r;
}

document.addEventListener('click', e => {
  const b = e.target.closest('.sprakvalg [data-sprak]');
  if (!b || b.dataset.sprak === sprak) return;
  sprak = b.dataset.sprak;
  try { localStorage.setItem(NOKKEL, sprak); } catch (err) {}
  const u = new URL(location.href);
  if (sprak === 'en') u.searchParams.set('lang', 'en'); else u.searchParams.delete('lang');
  history.replaceState(history.state, '', u);
  tegn();
});

tegn();
fetch('byer.json')
  .then(r => r.json())
  .then(m => { byer = (m.byer || []).filter(b => !b.skjult); tegn(); });
</script>
</body>
</html>
