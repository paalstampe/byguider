<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pål og Vibekes byguider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="forside">

<main class="forside-innhold">
  <header class="sidebar-head forside-head">
    <nav class="smuler" data-t-aria="duErHer">
      <a href="/">stam.pe</a><span class="smule-skille">/</span><span aria-current="page" data-t="byguider">Pål og Vibekes byguider</span>
      <span class="sprakvalg" role="group" data-t-aria="sprak"><button type="button" data-sprak="no" lang="no">NO</button><span class="smule-skille">/</span><button type="button" data-sprak="en" lang="en">EN</button></span>
    </nav>
    <h1 class="tittel" data-t="tittel">Pål og Vibekes byer</h1>
    <p class="ingress" data-t="ingress">Nabolag, gater og steder verdt en omvei.</p>
  </header>
  <nav class="by-liste" id="by-liste" data-t-aria="byer"></nav>
</main>

<script>
/* Språk: samme valg og lagring som i app.js (NO / EN, ?lang=en, husket i nettleseren).
   Lista bygges fra byer.json — ny by vises her automatisk. Engelske tekster fra
   feltene land_en, beskrivelse_en og evt. navn_en; mangler de, vises norsk.
   Miniatyr: bilder/<id>.webp (360×270, lages med .claude/miniatyrer.sh), eller feltet «bilde»
   i byer.json. By med status «kommer» eller uten bilde får en tom ramme i samme størrelse. */
const NOKKEL = 'byguider-sprak';
const TEKST = {
  no: { duErHer: 'Du er her', byguider: 'Pål og Vibekes byguider', tittel: 'Pål og Vibekes byer',
        ingress: 'Nabolag, gater og steder verdt en omvei.', byer: 'Byer', sprak: 'Språk' },
  en: { duErHer: 'You are here', byguider: 'Pål and Vibeke’s city guides', tittel: 'Pål and Vibeke’s cities',
        ingress: 'Neighbourhoods, streets and places worth a detour.', byer: 'Cities', sprak: 'Language' }
};

let sprak = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'en' || q === 'no') {
    try { localStorage.setItem(NOKKEL, q); } catch (e) {}
    return q;
  }
  try {
    const l = localStorage.getItem(NOKKEL);
    if (l === 'en' || l === 'no') return l;
  } catch (e) {}
  return 'no';
})();

let byer = [];

function tegn() {
  const T = TEKST[sprak];
  const en = sprak === 'en';
  document.documentElement.lang = sprak;
  document.title = T.byguider;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T[e.dataset.t]; });
  document.querySelectorAll('[data-t-aria]').forEach(e => { e.setAttribute('aria-label', T[e.dataset.tAria]); });
  document.querySelectorAll('.sprakvalg [data-sprak]').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.sprak === sprak ? 'true' : 'false');
  });

  const nav = document.getElementById('by-liste');
  nav.innerHTML = '';
  byer.forEach(b => {
    // status: "kommer" = vises dempet og uten lenke
    const klar = b.status !== 'kommer';
    const a = document.createElement(klar ? 'a' : 'div');
    a.className = 'by-lenke' + (klar ? '' : ' er-inaktiv');
    if (klar) a.href = b.id + '/' + (en ? '?lang=en' : '');
    else a.setAttribute('aria-disabled', 'true');
    let bilde;
    if (klar) {
      bilde = document.createElement('img');
      bilde.src = b.bilde || 'bilder/' + b.id + '.webp';
      bilde.alt = '';
      bilde.width = 120;
      bilde.height = 90;
      bilde.addEventListener('error', () => bilde.replaceWith(tomRamme()));
    } else bilde = tomRamme();
    bilde.classList.add('miniatyr');
    const tekst = document.createElement('span');
    tekst.className = 'by-tekst';
    const navn = document.createElement('span');
    navn.className = 'by-navn';
    navn.textContent = (en && b.navn_en) || b.navn;
    const meta = document.createElement('span');
    meta.className = 'by-meta';
    meta.textContent = [(en && b.land_en) || b.land, (en && b.beskrivelse_en) || b.beskrivelse]
      .filter(Boolean).join(' · ');
    tekst.append(navn, meta);
    a.append(bilde, tekst);
    nav.appendChild(a);
  });
}

function tomRamme() {
  const r = document.createElement('span');
  r.className = 'miniatyr er-tom';
  return r;
}

document.addEventListener('click', e => {
  const b = e.target.closest('.sprakvalg [data-sprak]');
  if (!b || b.dataset.sprak === sprak) return;
  sprak = b.dataset.sprak;
  try { localStorage.setItem(NOKKEL, sprak); } catch (err) {}
  const u = new URL(location.href);
  if (sprak === 'en') u.searchParams.set('lang', 'en'); else u.searchParams.delete('lang');
  history.replaceState(history.state, '', u);
  tegn();
});

tegn();
fetch('byer.json')
  .then(r => r.json())
  .then(m => { byer = m.byer || []; tegn(); });
</script>
</body>
</html>
